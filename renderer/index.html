<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob:; font-src 'self' data:; worker-src blob:; object-src 'none'; base-uri 'none'">
  <title>Cursor Local</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="logo">⌘ Cursor Local</div>
    <div class="mode-switch">
      <button id="mode-editor" class="active" title="传统代码编辑器">◧ Editor</button>
      <button id="mode-agents" title="Agent 工作台">🤖 Agents</button>
    </div>
    <div class="spacer"></div>
    <div id="workdir-label"></div>
    <button id="open-folder-btn" class="action">📁 打开文件夹</button>
    <button id="settings-btn" class="action">⚙ 设置</button>
  </header>

  <main>
    <!-- Editor Window -->
    <section id="editor-view" class="view active">
      <div id="filetree-panel">
        <div class="panel-title"><span>资源管理器</span></div>
        <div id="filetree">
          <div id="filetree-empty">尚未打开文件夹<br><button onclick="openFolder()">打开文件夹</button></div>
        </div>
      </div>
      <div id="editor-main">
        <div id="tabbar"></div>
        <div id="monaco-container"></div>
        <div id="editor-empty">在左侧选择文件开始编辑 · Ctrl+S 保存</div>
      </div>
    </section>

    <!-- Agents Window -->
    <section id="agents-view" class="view">
      <div id="agents-sidebar">
        <div class="panel-title"><span>Agents</span><button id="new-agent-btn">＋ 新建 Agent</button></div>
        <div id="agent-list"></div>
        <div id="history-section" class="hidden">
          <div class="history-title">历史会话</div>
          <div id="history-list"></div>
        </div>
        <div id="new-agent-form" class="hidden">
          <textarea id="agent-task-input" placeholder="描述任务，例如：&#10;阅读本项目代码，写一个 README.md 介绍项目结构"></textarea>
          <div class="form-actions">
            <span class="hint">Agent 将在当前工作目录运行，可并行启动多个</span>
            <button id="agent-run-btn">▶ 启动</button>
          </div>
        </div>
      </div>
      <div id="agents-main">
        <div id="agents-main-head" class="hidden">
          <span id="agent-head-dot" class="dot"></span>
          <span class="task-text" id="agent-head-task"></span>
          <span class="badge" id="agent-head-status"></span>
          <button id="agent-stop-btn" class="action" style="display:none">■ 停止</button>
        </div>
        <div id="transcript"></div>
        <div id="agents-empty">创建一个 Agent，让它替你读写代码、执行命令</div>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <span id="status-model">模型: -</span>
    <span id="status-warn" class="warn" style="display:none">⚠ 未配置 API Key</span>
    <div class="spacer"></div>
    <span id="status-right"></span>
  </footer>

  <!-- 设置弹窗 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h3>⚙ 设置</h3>
      <label>Base URL（OpenAI 兼容接口）
        <input id="cfg-baseurl" placeholder="https://api.deepseek.com/v1">
      </label>
      <label>API Key
        <input id="cfg-apikey" type="password" placeholder="sk-...">
      </label>
      <label>模型 ID
        <input id="cfg-model" placeholder="deepseek-flash">
      </label>
      <div class="modal-actions">
        <button id="cfg-cancel">取消</button>
        <button id="cfg-save" class="primary">保存</button>
      </div>
    </div>
  </div>

  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="editor.js"></script>
  <script src="agents.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
